site_name: Rgram
site_description: Regressograms and kernel smoothing for feature relationships.
site_url: https://jackgreenaway.github.io/Rgram/
repo_url: https://github.com/JackGreenaway/Rgram
repo_name: JackGreenaway/Rgram
edit_uri: edit/main/docs/
strict: true
theme:
  name: mkdocs
  custom_dir: docs_theme
  color_mode: dark
  user_color_mode_toggle: true
  nav_style: light
  highlightjs: true
  hljs_languages:
    - python
    - bash
nav:
  - Home: index.md
  - Getting started: getting_started.md
  - User guide:
      - Overview: user_guide.md
      - Theory and interpretation: theory.md
      - Estimators and pipelines: sklearn.md
      - Statistical parameters: statistical_parameters.md
      - Advanced usage: advanced.md
      - Component workflows: workflows.md
      - Data handling: data_contracts.md
  - Examples:
      - Overview: examples.md
      - Held-out prediction: gallery/prediction.md
      - Bandwidth: gallery/bandwidth.md
      - Bins: gallery/bins.md
      - Boundary: gallery/boundary.md
      - Influence: gallery/influence.md
      - Intervals: gallery/intervals.md
      - Residuals: gallery/residuals.md
      - Subgroups: gallery/subgroups.md
      - Summaries: gallery/summaries.md
      - Support: gallery/support.md
  - API reference:
      - Overview: api/index.md
      - Regressogram: api/regressogram.md
      - KernelSmoother: api/kernel_smoother.md
      - CoverageSearchCV: api/coverage_search.md
      - Aggregations: api/aggregation.md
      - Plotting: api/plotting.md
      - Warnings: api/warnings.md
      - Result schemas: api/results.md
  - Development and Pages: development.md
  - Implementation: internals.md
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
exclude_docs: |
  /_build/
  /requirements.txt
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
hooks:
  - scripts/docs_hooks.py
