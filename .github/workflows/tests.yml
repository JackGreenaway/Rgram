name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install locked development dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Test
        run: uv run --locked --python ${{ matrix.python-version }} pytest -q
      - name: Lint
        run: uv run --locked --python ${{ matrix.python-version }} ruff check src/rgram examples tests/test_estimator_contract.py tests/test_advanced_estimators.py tests/test_aggregation_and_transparency.py tests/test_properties.py scripts/build_api_reference.py scripts/check_docs.py
      - name: Check documentation tooling formatting
        run: uv run --locked --python ${{ matrix.python-version }} ruff format --check scripts/build_api_reference.py scripts/check_docs.py scripts/docs_hooks.py
