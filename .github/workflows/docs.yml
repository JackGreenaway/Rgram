name: Documentation

on:
  push:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'scripts/check*.py'
      - 'examples/**'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'scripts/check*.py'
      - 'examples/**'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install library and documentation dependencies
        run: python -m pip install '.[plot,pandas]' -r docs/requirements.txt
      - name: Check documentation coverage
        run: python scripts/check_docs.py
      - name: Execute documentation examples
        run: python scripts/check_examples.py
      - name: Build documentation with warnings as errors
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html
      - name: Check rendered API and internal links
        run: python scripts/check_docs.py --html docs/_build/html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
