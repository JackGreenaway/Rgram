name: Create GitHub Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python
        run: uv python install 3.11
      - name: Install locked dependencies
        run: uv sync --locked --python 3.11
      - name: Validate package
        run: |
          uv run --locked --python 3.11 pytest -q
          uv run --locked --python 3.11 ruff check src/rgram examples tests/test_estimator_contract.py tests/test_advanced_estimators.py tests/test_aggregation_and_transparency.py tests/test_properties.py scripts/build_api_reference.py scripts/check_docs.py
          uv run --locked --python 3.11 ruff format --check scripts/build_api_reference.py scripts/check_docs.py scripts/docs_hooks.py
      - name: Read package version
        id: version
        run: |
          uv run --locked --python 3.11 python - <<'PY'
          import os
          import re
          import tomllib

          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          from rgram import __version__

          if __version__ != version:
              raise SystemExit("Package __version__ must match project.version")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Release version must have the form X.Y.Z")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag=v{version}\n")
          PY
      - name: Reject an existing release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" > /tmp/release-refs.json
          uv run --locked --python 3.11 python - <<'PY'
          import json
          import tomllib

          with open("pyproject.toml", "rb") as source:
              tag = "v" + tomllib.load(source)["project"]["version"]
          with open("/tmp/release-refs.json") as source:
              refs = json.load(source)
          if any(ref["ref"] == f"refs/tags/{tag}" for ref in refs):
              raise SystemExit(f"{tag} already exists; bump project.version before releasing")
          PY
      - name: Build and validate wheel and source archive
        run: |
          uv build --out-dir "$RUNNER_TEMP/release-dist"
          uvx twine check --strict "$RUNNER_TEMP/release-dist"/*
      - name: Save distributions for PyPI publishing
        uses: actions/upload-artifact@v4
        with:
          name: created-release-dists
          path: |
            ${{ runner.temp }}/release-dist/*.whl
            ${{ runner.temp }}/release-dist/*.tar.gz
          if-no-files-found: error
      - name: Create release with distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_DIST: ${{ runner.temp }}/release-dist
        run: |
          gh release create "$RELEASE_TAG" "$RELEASE_DIST"/*.whl "$RELEASE_DIST"/*.tar.gz \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
